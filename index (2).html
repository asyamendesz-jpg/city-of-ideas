function projectRecord(record) {
  return {v:1,lang:state.lang,idea:record.idea,difference:record.difference,scene:record.scene,format:record.format,notes:record.notes,status:'draft'};
}
function decodeShare() {
  if (!location.hash.startsWith('#project=')) return null;
  try {
    const fragment = location.hash.slice(9);
    if (fragment.length>4500) throw Error('Oversized');
    const bytes=Uint8Array.from(atob(fragment.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
    const payload=JSON.parse(new TextDecoder().decode(bytes));
    if(payload.v!==1 || !Object.hasOwn(scenarios,payload.scene) || !['ru','en'].includes(payload.lang) ||
      !['website','app','interactive'].includes(payload.format) || !['idea','difference','notes'].every(k=>typeof payload[k]==='string') ||
      !payload.idea.trim() || payload.idea.length>90 || payload.difference.length>160 || payload.notes.length>350) throw Error('Invalid');
    return payload;
  } catch { invalidShare=true; return null; }
}
function shareUrl(record) {
  const bytes=new TextEncoder().encode(JSON.stringify(projectRecord(record)));
  const code=btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin+location.pathname+'#project='+code;
}
function brief(record) {
  const w=t(), scene=scenarios[record.scene];
  const route=scene.route.map((id,i)=>`${i+1}. ${local(scene.cards[id])}`).join('\n');
  return [w.draftHello, `${w.topic}\n${record.idea}\n${record.difference}`, `${w.goal}\n${goal(record)}`,
    `${w.tested}\n${route}`, `${w.format}\n${w[record.format]}`, `${w.model}\n${local(scene.model)}`,
    record.notes?`${w.notes}\n${record.notes}`:'',w.written].filter(Boolean).join('\n\n');
}

    ${shared ? (record.notes?`<p class="footnote"><strong>${w.notes}</strong><br>${esc(record.notes)}</p>`:'') :

    <label class="field">${w.notes}<textarea name="notes" maxlength="350">${esc(record.notes)}</textarea></label>
    <div class="panel-actions"><button class="primary">${w.save}</button></div></form></details>`}

    ${shareVisible&&!shared?`<div class="share"><p>${child?w.adultHint:w.shareHint}</p>
      ${location.protocol==='file:'?`<p>${w.sharedNote}</p>`:`<label class="field">${w.shareLabel}<input id="share-value" readonly value="${esc(shareUrl(record))}"></label>${button('copyLink',w.copyLink)}`}
      </div>`:''}
    <hr style="border:0;border-top:1px solid var(--edge);margin:22px 0">
    ${child?`<p>${w.adultHint}</p>`:`<p>${w.invitation}</p><p><strong>${w.written}</strong></p>
    ${button('inquiry',w.contact,'primary')}
    ${inquiryVisible?`<div class="share"><label class="field">${w.draft}<textarea id="inquiry-value" rows="8" readonly>${esc(brief(record))}</textarea></label>
    <div class="panel-actions">${button('copyDraft',w.copyDraft)}<a class="primary" href="https://portfo.ru/#collab-form" target="_blank" rel="noopener">${w.form}</a></div><p class="muted">${w.paste}</p></div>`:''}`}
    <p class="notice" id="notice" role="status">${esc(notice)}</p>
    </section>`;
}

let audioContext, melodyTimer;
function audio() {
  try {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state==='suspended') audioContext.resume().catch(()=>{});
    return audioContext;
  } catch { return null; }
}
const oscillators = new Set();
function tone(hz, delay, duration, volume, channel) {
  const ctx=audio();
  if (!ctx) return;
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  const at=ctx.currentTime+delay;
  osc.type='sine';
  osc.frequency.value=hz;
  gain.gain.setValueAtTime(.0001,at);
  gain.gain.exponentialRampToValueAtTime(volume,at+.055);
  gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
  osc.connect(gain).connect(ctx.destination);
  const note={osc,channel};
  oscillators.add(note);
  osc.onended=()=>{osc.disconnect();gain.disconnect();oscillators.delete(note);};
  osc.start(at);
  osc.stop(at+duration+.025);
}
function silence(channel) {
  for (const note of oscillators) {
    if (note.channel===channel) try { note.osc.stop(); } catch {}
  }
}
function effect(success=false) {
  if (state.effects) (success?[523,659,784]:[440]).forEach((n,i)=>tone(n,i*.09,.25,.025,'effects'));
}
function music() {
  clearInterval(melodyTimer);
  silence('music');
  if (!state.music || !audio()) return;
  const phrase=()=>[261.6,392,329.6,440,293.7,349.2].forEach((n,i)=>tone(n,i*.92,1.4,.011,'music'));
  phrase();
  melodyTimer=setInterval(phrase,7800);
}
function panelScroll() {
  if (matchMedia('(max-width: 720px)').matches) document.querySelector('#dialog')?.scrollIntoView({block:'nearest'});
}
function moveTo(x,y) {
  state.x=Math.round(Math.max(35,Math.min(970,x)));
  state.y=Math.round(Math.max(297,Math.min(385,y)));
  const hero=document.querySelector('#hero');
  if (hero) {
    hero.style.setProperty('--x',state.x/10+'%');
    hero.style.setProperty('--y',state.y/4.7+'%');
    hero.classList.remove('walk');
    void hero.offsetWidth;
    hero.classList.add('walk');
  }
  save();
}
function move(direction) {
  const branch=Object.values(plots).find(x=>Math.abs(x-state.x)<26);
  if (direction==='up' && branch) moveTo(branch,state.y-20);
  if (direction==='down') moveTo(state.x,state.y+20);
  if (direction==='left' || direction==='right') {
    const sign=direction==='left'?-1:1;
    if (state.y<345) moveTo(state.x,state.y+23);
    else moveTo(state.x+sign*24,365);
  }
}
function visit(id, nextPanel) {
  const old={x:state.x,y:state.y};
  state.x=plots[id];
  state.y=305;
  panel=nextPanel;
  save();
  render();
  const hero=document.querySelector('#hero');
  const walk = hero && !matchMedia('(prefers-reduced-motion: reduce)').matches
    ? hero.animate?.([
    {left:old.x/10+'%',top:old.y/4.7+'%'},
    {left:old.x/10+'%',top:'77.6%',offset:.19},
    {left:state.x/10+'%',top:'77.6%',offset:.79},
    {left:state.x/10+'%',top:state.y/4.7+'%'}
    ],{duration:Math.min(1100,350+Math.abs(old.x-state.x)),easing:'ease-in-out'}) : null;
  effect();
  if (nextPanel !== 'neighbor') {
    panelScroll();
    return;
  }
  const revealDialog = () => {
    if (panel !== 'neighbor' || neighbor !== id) return;
    const dialogue = document.querySelector('#dialog');
    dialogue?.scrollIntoView({block:'nearest'});
    dialogue?.querySelector('h2')?.focus({preventScroll:true});
  };
  if (walk?.finished) walk.finished.then(revealDialog, () => {});
  else revealDialog();
}
function put(index, piece) {
  if (!piece || !Number.isInteger(index) || index<0 || index>3 || !data().cards[piece.id]) return;
  const previous=state.slots.indexOf(piece.id);
  if (previous!==-1 && previous!==index) state.slots[previous]=state.slots[index];
  state.slots[index]=piece.id;
  selection=null;
  step=-1;
  error='';
  notice='';
  save();
  effect();
  render();
  app.querySelector(`[data-action="slot"][data-id="${index}"]`)?.focus({preventScroll:true});
}
function progressRoute() {
  const scenario=data(), current=state.slots[step], expected=scenario.route[step];
  if (current!==expected) {
    error=(current?t().wrong:t().missing)+' '+local(scenario.hints[expected]);
    render();
    return;
  }
  step++;
  if (step===scenario.route.length) {
    state.open=true;
    panel='';
    save();
    effect(true);
    render();
    panelScroll();
    return;
  }
  notice=t().okay+' '+local(scenario.cards[current])+' ✓';
  effect();
  render();
  const walker=document.querySelector('#walker');
  walker?.animate([{left:(155+(step-1)*18)/10+'%',top:(365-(step-1)*16)/4.7+'%'},{left:(155+step*18)/10+'%',top:(365-step*16)/4.7+'%'}],
    {duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:280,easing:'ease-out'});
}
function updateSetting(action) {
  const form=app.querySelector('form'), formType=form?.dataset.form;
  const values=form?Object.fromEntries(new FormData(form)):{};
  const expanded=app.querySelector('details')?.open;
  if (action==='ru'||action==='en') {
    state.lang=action;
    if (error && step>=0) {
      error=(state.slots[step]?t().wrong:t().missing)+' '+local(data().hints[data().route[step]]);
    } else if (step>=0) notice=step===0?t().before:t().okay;
  } else {
    state[action]=!state[action];
    if (action==='music') music();
    else if (state.effects) effect();
    else silence('effects');
  }
  save();
  render();
  const newForm=app.querySelector('form');
  if (newForm?.dataset.form===formType && formType) {
    for (const [name,value] of Object.entries(values)) newForm.elements.namedItem(name).value=value;
  }
  if (expanded) app.querySelector('details')?.setAttribute('open','');
  settings.querySelector(`[data-action="${action}"]`)?.focus({preventScroll:true});
}
async function copyField(id) {
  const field=document.getElementById(id);
  if (!field) return;
  try {
    await navigator.clipboard.writeText(field.value);
    notice=t().copied;
  } catch {
    field.focus();
    field.select();
    notice=t().selectCopy;
  }
  const status=document.querySelector('#notice');
  if (status) status.textContent=notice;
}
function download(record) {
  const url=URL.createObjectURL(new Blob([brief(record)],{type:'text/plain;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;
  a.download='city-of-ideas-blueprint.txt';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function switchPanel(next) {
  panel=next;
  notice='';
  render();
  if (next==='blueprint'||next==='') window.scrollTo({top:0,behavior:'instant'});
}

document.addEventListener('click', event=>{
  const control=event.target.closest('[data-action]');
  if (!control) {
    const world=event.target.closest('#world');
    if (world) {
      const box=world.getBoundingClientRect();
      const x=(event.clientX-box.left)/box.width*1000;
      const y=(event.clientY-box.top)/box.height*470;
      const branch=Object.values(plots).find(plot=>Math.abs(plot-x)<32);
      moveTo(branch && y<350?branch:x,branch && y<350?305:365);
    }
    return;
  }
  const {action,id}=control.dataset;
  const w=t();
  switch (action) {
    case 'ru': case 'en': case 'effects': case 'music':
      updateSetting(action);
      break;
    case 'avatar':
      state.avatar=id;
      state.x=224;
      state.y=342;
      save();
      if (state.music) music();
      render();
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        if (state.y===342 && state.x===224 && !state.idea) moveTo(224,305);
      }));
      break;
    case 'move':
      move(id);
      break;
    case 'home':
      if (state.open) switchPanel('blueprint');
      else if (!state.idea) {
        visit('home','idea');
        app.querySelector('input[name="idea"]')?.focus({preventScroll:true});
      } else if (state.difference) visit('home','puzzle');
      else {
        visit('home','');
        panelScroll();
      }
      break;
    case 'neighbor':
      neighbor=id;
      if (!state.open) { step=-1; error=''; selection=null; notice=''; }
      visit(id,'neighbor');
      break;
    case 'card':
      selection={id,from:null};
      render();
      app.querySelector(`[data-action="card"][data-id="${id}"]`)?.focus({preventScroll:true});
      break;
    case 'slot': {
      const index=Number(id);
      if (selection) put(index,selection);
      else if (state.slots[index]) {
        selection={id:state.slots[index],from:index};
        render();
        app.querySelector(`[data-action="slot"][data-id="${id}"]`)?.focus({preventScroll:true});
      } else {
        notice=w.select;
        render();
      }
      break;
    }
    case 'remove':
      if (selection?.from!=null) state.slots[selection.from]=null;
      selection=null;
      step=-1;
      error='';
      notice='';
      save();
      render();
      break;
    case 'clear':
      state.slots=[null,null,null,null];
      selection=null;
      step=-1;
      error='';
      notice='';
      save();
      render();
      break;
    case 'test':
      step=0;
      error='';
      notice=w.before;
      selection=null;
      render();
      app.querySelector('[data-action="next"]')?.focus({preventScroll:true});
      break;
    case 'next':
      progressRoute();
      app.querySelector('[data-action="next"], [data-action="retry"], .dialog [data-action="blueprint"]')?.focus({preventScroll:true});
      break;
    case 'retry':
      step=-1;
      error='';
      notice='';
      render();
      break;
    case 'blueprint':
      switchPanel('blueprint');
      break;
    case 'map':
      switchPanel('');
      break;
    case 'share':
      save();
      shareVisible=!shareVisible;
      render();
      break;
    case 'inquiry':
      inquiryVisible=!inquiryVisible;
      render();
      document.querySelector('#inquiry-value')?.focus();
      break;
    case 'copyLink': copyField('share-value'); break;
    case 'copyDraft': copyField('inquiry-value'); break;
    case 'download': download(shared||state); break;
    case 'own':
      history.replaceState(null,'',location.pathname+location.search);
      shared=null;
      invalidShare=false;
      switchPanel('');
      break;
    case 'reset':
      if (confirm(w.resetPrompt)) {
        state={...blank(),lang:state.lang,effects:state.effects,music:state.music};
        panel='';
        selection=null;
        step=-1;
        error='';
        notice='';
        shareVisible=false;
        inquiryVisible=false;
        save();
        render();
        window.scrollTo(0,0);
      }
  }
});
document.addEventListener('submit', event=>{
  const form=event.target;
  const type=form.dataset.form;
  if (!type) return;
  event.preventDefault();
  const fields=Object.fromEntries(new FormData(form));
  const required=type==='idea'?['idea']:type==='difference'?['difference']:['idea','difference'];
  for (const name of required) {
    if (!fields[name]?.trim()) {
      form.elements.namedItem(name).value='';
      form.elements.namedItem(name).reportValidity();
      return;
    }
  }
  if (type==='idea') {
    state.idea=fields.idea.trim();
    state.scene=matching(state.idea);
    state.format=data().format;
    panel='';
  } else if (type==='difference') {
    state.difference=fields.difference.trim();
    panel='';
  } else if (type==='blueprint') {
    state.idea=fields.idea.trim();
    state.difference=fields.difference.trim();
    state.format=fields.format;
    state.notes=fields.notes.trim();
    notice=t().saved;
  }
  save();
  effect(true);
  render();
});
const directions = {arrowleft:'left',a:'left',ф:'left',arrowright:'right',d:'right',в:'right',arrowup:'up',w:'up',ц:'up',arrowdown:'down',s:'down',ы:'down'};
document.addEventListener('keydown', event=>{
  if (event.target.closest('input,textarea,select,[contenteditable]') || event.ctrlKey || event.metaKey || event.altKey) return;
  const direction=directions[event.key.toLowerCase()];
  if (!direction || !state.avatar || shared || panel==='blueprint') return;
  event.preventDefault();
  move(direction);
});
let dragged=null;
document.addEventListener('dragstart', event=>{
  const el=event.target.closest('[data-action="card"],[data-action="slot"]');
  if (!el || !el.draggable) return;
  const from=el.dataset.action==='slot'?Number(el.dataset.id):null;
  dragged={id:from===null?el.dataset.id:state.slots[from],from};
  event.dataTransfer.setData('text/plain',dragged.id);
  event.dataTransfer.effectAllowed='move';
});
document.addEventListener('dragover', event=>{
  if (dragged && event.target.closest('.slot')) event.preventDefault();
});
document.addEventListener('drop', event=>{
  const slot=event.target.closest('.slot');
  if (!dragged||!slot) return;
  event.preventDefault();
  put(Number(slot.dataset.id),dragged);
  dragged=null;
});
document.addEventListener('dragend',()=>{dragged=null;});
window.addEventListener('hashchange',()=>{
  invalidShare=false;
  shared=decodeShare();
  if (shared) state.lang=shared.lang;
  render();
});
document.addEventListener('visibilitychange',()=>{
  if (document.hidden) {
    clearInterval(melodyTimer);
    silence('music');
    silence('effects');
  } else if (state.music && audioContext) music();
});
render();
document.addEventListener('pointerdown',function restoreSound(event) {
  if (state.music && !event.target.closest('[data-action="music"]') && !audioContext) music();
},{once:true});
</script>
